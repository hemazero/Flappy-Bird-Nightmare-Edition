<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050305">
<title>Flappy Bird · Nightmare Edition | فلابي بيرد · النسخة المرعبة</title>
<!-- Optional web font (Arabic + Latin). The game falls back to system fonts if offline. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--blood:#b91c1c;--blood-hi:#ef4444;--bone:#ece4d6;--dim:#a39a92;--gold:#f5c542;--ink:#0a0608}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#050305;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;color:var(--bone);
  font-family:'Cairo','Segoe UI',Tahoma,'Noto Sans Arabic','Noto Sans',Arial,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;color:inherit}
svg{display:block}
.i-fill{fill:currentColor}
.i-stroke{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

#game{position:relative;overflow:hidden;background:#0a0608;border-radius:22px;touch-action:none;
  box-shadow:0 0 0 2px #2b1318,0 24px 90px rgba(0,0,0,.85),0 0 140px rgba(150,10,25,.22);
  --ls:.05em;letter-spacing:var(--ls)}
#game[dir=rtl]{--ls:0}
@media (max-width:480px){#game{border-radius:0;box-shadow:none}}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
#vignette{position:absolute;inset:0;z-index:2;pointer-events:none;box-shadow:inset 0 0 110px 20px rgba(0,0,0,.75)}
#bloodEdge{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity 1s;
  animation:edgePulse 1.8s ease-in-out infinite alternate}
#bloodEdge.on{opacity:1}
@keyframes edgePulse{from{box-shadow:inset 0 0 40px rgba(255,0,0,.18)}to{box-shadow:inset 0 0 95px rgba(255,0,0,.55)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes flicker{0%,18%,22%,62%,64%,100%{opacity:1}20%,63%{opacity:.35}}
@keyframes tapPulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.08);opacity:1}}

/* ---------- Buttons & small UI ---------- */
.btn{font-weight:900;font-size:20px;border:0;border-radius:16px;padding:13px 22px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;position:relative;
  transition:transform .12s,filter .2s;letter-spacing:var(--ls);line-height:1.2}
.btn:active{transform:scale(.96)}
.btn:hover{filter:brightness(1.12)}
.btn.primary{color:#fff;background:linear-gradient(180deg,#e03131,#8b1a1a 70%,#5e1010);
  box-shadow:0 0 0 2px #ff9b9b55 inset,0 6px 0 #3a0a0a,0 10px 24px rgba(185,28,28,.35)}
.btn.primary:active{box-shadow:0 0 0 2px #ff9b9b55 inset,0 2px 0 #3a0a0a}
.btn.ghost{background:rgba(20,10,14,.85);border:2px solid #4a1a22;color:var(--bone)}
.btn.big{font-size:26px;padding:16px 26px;width:100%;max-width:300px}
.btn.small{font-size:15px;padding:8px 14px;border-radius:999px}
.btn .ico svg{width:22px;height:22px}
.ico{display:inline-flex}
.flip{display:inline-flex}
#game[dir=rtl] .flip svg{transform:scaleX(-1)}
.iconbtn{pointer-events:auto;min-width:44px;height:44px;border-radius:14px;border:2px solid #4a1a22;
  background:rgba(14,6,9,.78);color:var(--bone);display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0 10px;font-weight:900;font-size:15px;transition:transform .12s,background .2s}
.iconbtn:active{transform:scale(.92)}
.iconbtn svg{width:22px;height:22px}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(14,6,9,.78);border:2px solid #4a1a22;
  border-radius:999px;padding:5px 14px;font-weight:700;font-size:14px;pointer-events:none}
.chip svg{width:16px;height:16px;fill:var(--gold)}
.seg{display:inline-flex;background:rgba(0,0,0,.55);border:2px solid #3a1a1f;border-radius:999px;padding:3px;direction:ltr}
.seg button{border:0;background:transparent;padding:7px 16px;border-radius:999px;font-weight:900;font-size:15px;
  cursor:pointer;color:var(--dim);letter-spacing:0}
.seg button.on{background:linear-gradient(180deg,#dc2626,#8b1a1a);color:#fff}

/* ---------- Screens ---------- */
.screen{position:absolute;inset:0;z-index:10;display:none;flex-direction:column}
.screen.active{display:flex;animation:fadeIn .4s ease both}
.modal{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:22px;
  background:rgba(3,1,4,.74);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.modal.active{display:flex;animation:fadeIn .3s ease both}
.card{width:100%;max-width:340px;max-height:100%;overflow:auto;text-align:center;
  background:linear-gradient(180deg,#1b0d12,#0d070a);border:2px solid #4a1a22;border-radius:22px;padding:22px 20px;
  box-shadow:0 20px 60px #000,0 0 50px rgba(185,28,28,.22) inset}

/* Menu */
#menu{align-items:center;justify-content:space-between;text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 34px) 22px calc(env(safe-area-inset-bottom,0px) + 22px);
  background:radial-gradient(ellipse at 50% 28%,rgba(70,8,18,.18),rgba(5,2,5,.8) 75%)}
.t1{font-size:56px;font-weight:900;line-height:1.05;color:var(--gold);
  text-shadow:0 0 22px rgba(245,197,66,.35),0 5px 0 #6b3a05,0 10px 18px rgba(0,0,0,.85)}
.t2{font-size:20px;font-weight:900;color:#ff4d4d;margin-top:6px;text-shadow:0 0 14px rgba(255,0,0,.7);animation:flicker 3.6s infinite}
.tag{font-size:14px;color:var(--dim);margin:10px auto 0;max-width:270px;line-height:1.6}
.menu-bottom{width:100%;display:flex;flex-direction:column;align-items:center;gap:14px}
.row-tools{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.how{width:100%;max-width:300px;background:rgba(0,0,0,.5);border:1px solid #3a1a1f;border-radius:14px;padding:10px 14px;
  font-size:13px;color:#cfc5ba;text-align:start;line-height:1.55}
.how b{display:block;color:var(--gold);margin-bottom:2px;font-size:14px}
.how ul{margin:0;padding-inline-start:18px}
.menu-stars{display:flex;align-items:center;gap:6px;font-weight:900;color:var(--gold);font-size:16px}
.menu-stars svg{width:20px;height:20px;fill:var(--gold)}

/* HUD */
#hud{position:absolute;inset:0;z-index:5;pointer-events:none;display:none}
#hud.on{display:block}
.hud-top{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;justify-content:space-between;align-items:center}
#scoreWrap{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 66px);display:flex;flex-direction:column;align-items:center;gap:7px}
#score{font-weight:900;font-size:58px;line-height:1;color:#fff;font-variant-numeric:tabular-nums;
  text-shadow:0 4px 0 rgba(0,0,0,.55),0 0 24px rgba(220,38,38,.45)}
#objText{font-weight:700;font-size:14px;color:#eadccd;background:rgba(0,0,0,.5);padding:3px 13px;border-radius:999px}
#objBar{width:56%;max-width:210px;height:7px;border-radius:99px;background:rgba(0,0,0,.6);overflow:hidden;border:1px solid #3a1a1f}
#objBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7f1d1d,#ef4444);transition:width .25s}
#phaseBadge{display:none;font-weight:900;font-size:12px;color:#ff4d4d;background:rgba(0,0,0,.65);border:1px solid #7f1d1d;
  border-radius:999px;padding:2px 12px;animation:flicker 1.6s infinite}
#phaseBadge.on{display:block}
#ready{position:absolute;left:0;right:0;top:57%;z-index:5;display:none;flex-direction:column;align-items:center;
  text-align:center;pointer-events:none;gap:4px;padding:0 24px}
#ready.on{display:flex}
.r-level{font-weight:700;color:var(--dim);font-size:15px}
.r-name{font-weight:900;font-size:28px;color:var(--bone);text-shadow:0 0 18px rgba(185,28,28,.85),0 3px 0 #000;line-height:1.25}
.r-obj{font-weight:700;font-size:16px;color:#ffb4b4;margin-top:4px}
.r-tap{margin-top:20px;font-weight:900;font-size:22px;color:var(--gold);animation:tapPulse 1.2s infinite}

/* Warning banner */
#warn{position:absolute;left:0;right:0;top:34%;z-index:6;text-align:center;pointer-events:none;opacity:0;padding:0 14px}
#warn span{display:inline-block;font-weight:900;font-size:30px;line-height:1.3;color:#ff2a2a;
  text-shadow:0 0 14px rgba(255,0,0,.9),2px 0 rgba(0,229,255,.35),-2px 0 rgba(255,0,170,.35)}
#warn.soft span{font-size:22px;color:#e8d9d0;text-shadow:0 0 10px rgba(200,0,0,.65)}
#warn.show{animation:warnAnim 2.6s ease both}
@keyframes warnAnim{0%{opacity:0;transform:scale(1.4)}8%{opacity:1;transform:scale(1)}12%{transform:translate(-5px,2px)}
  16%{transform:translate(5px,-2px)}20%{transform:none}80%{opacity:1}100%{opacity:0}}
#toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);transform:translate(-50%,20px);z-index:30;
  background:rgba(20,8,12,.95);border:2px solid #7f1d1d;color:var(--bone);font-weight:700;font-size:14px;padding:9px 16px;
  border-radius:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:86%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* Level map */
#map{background:#06030a}
.map-head{display:flex;align-items:center;gap:10px;z-index:3;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 10px;background:linear-gradient(#0b0509,#0b0509ee);border-bottom:2px solid #2a1218}
.map-head h2{flex:1;margin:0;font-size:20px;font-weight:900;color:var(--bone);text-align:center}
#mapScroll{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;touch-action:pan-y;overscroll-behavior:contain;
  scrollbar-width:thin;scrollbar-color:#4a1a22 transparent}
#mapInner{position:relative;width:100%;background:linear-gradient(to top,#2c0a10 0%,#150811 35%,#0a0612 70%,#04030a 100%)}
#mapInner>svg.mapsvg{position:absolute;inset:0;width:100%;height:100%}
.eyes circle{animation:eyeBlink 4s infinite}
.eyes circle:nth-child(2){animation-delay:.05s}
@keyframes eyeBlink{0%,42%,48%,100%{opacity:.95}45%{opacity:0}}
.node{position:absolute;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;border:3px solid #6b2029;padding:0;
  background:radial-gradient(circle at 35% 30%,#ef4444,#8b1a1a 55%,#2a0709);color:#fff;font-weight:900;font-size:25px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;letter-spacing:0;
  box-shadow:0 0 18px rgba(185,28,28,.45),0 6px 0 #2a0709;transition:transform .15s}
.node:active{transform:scale(.93)}
.node.locked{background:radial-gradient(circle at 35% 30%,#3a3440,#1a1620 70%);border-color:#2f2a35;color:#7b7385;
  box-shadow:0 5px 0 #0c0a10;cursor:not-allowed}
.node.locked svg{width:26px;height:26px}
.node.done{border-color:var(--gold)}
.node.current{animation:nodePulse 1.5s ease-in-out infinite}
.node.fresh{animation:nodePulse 1.5s ease-in-out infinite,unlockPop .9s cubic-bezier(.2,1.5,.4,1) both}
.node.shake{animation:nodeShake .4s}
.nstars{position:absolute;bottom:-21px;left:50%;transform:translateX(-50%);display:flex;gap:0;direction:ltr}
.nstars svg{width:18px;height:18px}
.nstars .on svg{fill:var(--gold);stroke:#8a5a00;stroke-width:1.2}
.nstars .off svg{fill:#2a1f26;stroke:#4a3a42;stroke-width:1.2}
@keyframes nodePulse{0%,100%{box-shadow:0 0 14px rgba(239,68,68,.5),0 6px 0 #2a0709}50%{box-shadow:0 0 34px rgba(255,80,80,.95),0 6px 0 #2a0709}}
@keyframes unlockPop{0%{transform:scale(.3) rotate(-25deg);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes nodeShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* Cards: info & result */
.rk{font-size:30px;font-weight:900;margin-bottom:4px;line-height:1.2}
.rk.win{color:var(--gold);text-shadow:0 0 18px rgba(245,197,66,.45)}
.rk.lose{color:#ff3b3b;text-shadow:0 0 18px rgba(255,0,0,.5)}
.rname{color:var(--dim);font-weight:700;font-size:15px;margin-bottom:8px}
.rquote{color:#cdbfb3;font-size:15px;margin:6px 0 12px;line-height:1.5}
.newbest{display:inline-block;color:#111;background:var(--gold);font-weight:900;font-size:13px;border-radius:999px;padding:2px 12px;margin-bottom:10px;animation:tapPulse 1s infinite}
.rstars{display:flex;justify-content:center;align-items:flex-end;gap:4px;margin:4px 0 12px;direction:ltr}
.rstars .st svg{width:62px;height:62px}
.rstars .st:nth-child(2){margin-bottom:12px}
.rstars.small .st svg{width:34px;height:34px}
.rstars.small .st:nth-child(2){margin-bottom:6px}
.st.on svg{fill:var(--gold);stroke:#a16207;stroke-width:1.2;stroke-linejoin:round;filter:drop-shadow(0 0 9px rgba(245,197,66,.7))}
.st.off svg{fill:#241a20;stroke:#4a3a42;stroke-width:1.2;stroke-linejoin:round}
.st.anim{opacity:0;animation:starPop .6s cubic-bezier(.2,1.6,.4,1) forwards;animation-delay:calc(.35s + var(--i)*.38s)}
@keyframes starPop{0%{opacity:0;transform:scale(.1) rotate(-60deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 12px}
.stats div{background:rgba(0,0,0,.45);border:1px solid #3a1a1f;border-radius:12px;padding:8px 4px}
.stats span{display:block;font-size:12px;color:var(--dim);font-weight:700}
.stats b{font-size:22px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums}
.unlock{color:#9bffd6;font-weight:900;font-size:14px;margin:0 0 10px;text-shadow:0 0 10px rgba(80,255,200,.4)}
.progress{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:13px;font-weight:700;color:var(--dim)}
.pbar{flex:1;height:8px;border-radius:99px;background:#000;border:1px solid #3a1a1f;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#7f1d1d,#ef4444)}
.btncol{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.btnrow{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.i-num{color:var(--dim);font-weight:700;font-size:14px}
.i-name{margin:2px 0 4px;font-size:26px;font-weight:900;color:var(--bone);text-shadow:0 0 16px rgba(185,28,28,.7);line-height:1.25}
.i-rows{margin:6px 0 8px;display:flex;flex-direction:column;gap:6px}
.i-rows>div{display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(0,0,0,.42);border:1px solid #3a1a1f;border-radius:12px;padding:8px 12px;font-size:14px}
.i-rows span{color:var(--dim);font-weight:700}
.i-rows b{font-weight:900;color:#fff;text-align:end}
.skulls{display:inline-flex;gap:2px;direction:ltr}
.skull svg{width:18px;height:18px;color:#3a2c33}
.skull.on svg{color:#ef4444}
.hint{margin:4px 0 10px;font-size:13px;color:#b8aca0;line-height:1.5}
.row-tools.center{margin-top:14px}
</style>
</head>
<body>
<div id="game" dir="rtl">
  <canvas id="cv"></canvas>
  <div id="vignette"></div>
  <div id="bloodEdge"></div>

  <!-- In-game HUD -->
  <div id="hud">
    <div class="hud-top">
      <button class="iconbtn" id="pauseBtn" data-action="pause" aria-label="Pause" data-icon="pause"></button>
      <div class="chip" id="hudLevel"></div>
    </div>
    <div id="scoreWrap">
      <div id="score">0</div>
      <div id="objText"></div>
      <div id="objBar"><i id="objFill"></i></div>
      <div id="phaseBadge"></div>
    </div>
  </div>
  <div id="ready">
    <div class="r-level" id="readyLevel"></div>
    <div class="r-name" id="readyName"></div>
    <div class="r-obj" id="readyObj"></div>
    <div class="r-tap" id="readyTap"></div>
  </div>
  <div id="warn"><span id="warnTxt"></span></div>
  <div id="toast" role="status"></div>

  <!-- Main menu -->
  <section id="menu" class="screen">
    <div>
      <div class="t1" data-i18n="title1"></div>
      <div class="t2" data-i18n="title2"></div>
      <p class="tag" data-i18n="tagline"></p>
    </div>
    <div class="menu-bottom">
      <button class="btn primary big" data-action="play"><span class="ico flip" data-icon="play"></span><span data-i18n="play"></span></button>
      <div class="row-tools">
        <div class="seg" role="group" aria-label="Language">
          <button data-action="lang" data-v="ar" data-lang-btn="ar">العربية</button>
          <button data-action="lang" data-v="en" data-lang-btn="en">English</button>
        </div>
        <button class="btn ghost small" data-action="sound" data-sound></button>
      </div>
      <div class="how">
        <b data-i18n="howTitle"></b>
        <ul><li data-i18n="how1"></li><li data-i18n="how2"></li><li data-i18n="how3"></li></ul>
      </div>
      <div class="menu-stars"><span class="ico" data-icon="star"></span><span id="menuStars"></span></div>
    </div>
  </section>

  <!-- Level map -->
  <section id="map" class="screen">
    <header class="map-head">
      <button class="iconbtn flip" data-action="menu" aria-label="Back" data-icon="back"></button>
      <h2 data-i18n="map"></h2>
      <div class="chip"><span class="ico" data-icon="star"></span><span id="mapStars"></span></div>
      <button class="iconbtn" data-action="lang" data-v="toggle" aria-label="Language"><span id="langMini"></span></button>
    </header>
    <div id="mapScroll"><div id="mapInner"></div></div>
  </section>

  <!-- Level info -->
  <section id="info" class="modal"><div class="card" id="infoCard"></div></section>

  <!-- Pause -->
  <section id="pause" class="modal">
    <div class="card">
      <div class="rk lose" style="color:var(--bone);text-shadow:none" data-i18n="paused"></div>
      <div class="btncol">
        <button class="btn primary" data-action="resume" data-i18n="resume"></button>
        <button class="btn ghost" data-action="retry" data-i18n="restart"></button>
        <button class="btn ghost" data-action="quitMap" data-i18n="toMap"></button>
        <button class="btn ghost" data-action="quitMenu" data-i18n="toMenu"></button>
      </div>
      <div class="row-tools center">
        <div class="seg" role="group" aria-label="Language">
          <button data-action="lang" data-v="ar" data-lang-btn="ar">العربية</button>
          <button data-action="lang" data-v="en" data-lang-btn="en">English</button>
        </div>
        <button class="btn ghost small" data-action="sound" data-sound></button>
      </div>
    </div>
  </section>

  <!-- Result (level complete / game over) -->
  <section id="result" class="modal"><div class="card" id="resultCard"></div></section>
</div>

<script>
(() => {
'use strict';

/* =====================================================================
   1. HELPERS
   ===================================================================== */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp  = (a, b, t) => a + (b - a) * t;
const rand  = (a, b) => a + Math.random() * (b - a);
const pick  = a => a[Math.floor(Math.random() * a.length)];
const TAU = Math.PI * 2;
const REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

function rng32(seed) {            // small deterministic PRNG
  let a = seed | 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hex2rgb(h) { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
function mixHex(a, b, t) {
  const A = hex2rgb(a), B = hex2rgb(b);
  return `rgb(${Math.round(lerp(A[0], B[0], t))},${Math.round(lerp(A[1], B[1], t))},${Math.round(lerp(A[2], B[2], t))})`;
}
function rgba(hex, a) { const c = hex2rgb(hex); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function rr(c, x, y, w, h, r) {   // rounded rect path (no roundRect dependency)
  c.beginPath(); c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);

let viewScale = 1, bgScale = 1, bgFar = null, bgMid = null, bgGround = null;
function layout() {
  const vw = window.innerWidth, vh = window.innerHeight;
  let w = Math.min(vw, 460), h = Math.min(vh, 900);
  if (w / h > 0.76) w = h * 0.76;          // desktop: keep a portrait play-field
  if (h / w > 1.9) h = w * 1.9;            // very tall phones
  w = Math.floor(w); h = Math.floor(h);
  game.style.width = w + 'px'; game.style.height = h + 'px';
  LH = Math.round(LW * h / w);
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  viewScale = canvas.width / LW;
  bird.y = clamp(bird.y, BIRD_R, LH - GROUND_H - BIRD_R);
  buildBackground();
  if (G.screen === 'map') renderMap(true);
}

   9. BACKGROUND LAYERS (pre-rendered, parallax)

function newLayer(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.ceil(w * bgScale); c.height = Math.ceil(h * bgScale);
  const g = c.getContext('2d'); g.scale(bgScale, bgScale);
  return { c, g };
}
function drawCastle(g, x, y, s, th) {
  g.fillStyle = th.far;
  const R = (dx, w, h) => g.fillRect(x + dx * s, y - h * s, w * s, h * s + 2);
  R(-46, 92, 40); R(-52, 22, 78); R(30, 22, 70); R(-8, 16, 96);
  const roof = (cx, w, h, base) => {
    g.beginPath(); g.moveTo(x + (cx - w / 2) * s, y - base * s); g.lineTo(x + cx * s, y - (base + h) * s);
    g.lineTo(x + (cx + w / 2) * s, y - base * s); g.closePath(); g.fill();
  };
  roof(-41, 30, 34, 78); roof(41, 30, 34, 70); roof(0, 24, 40, 96);
  g.fillStyle = th.win;
  [[-44, 60], [38, 52], [-3, 78], [-3, 60], [-20, 28], [14, 28]].forEach(p => g.fillRect(x + p[0] * s, y - p[1] * s, 5 * s, 8 * s));
}
function drawDeadTree(g, x, y, h, r, col) {
  g.strokeStyle = col; g.lineCap = 'round';
  const branch = (x0, y0, len, ang, w, d) => {
    const x1 = x0 + Math.cos(ang) * len, y1 = y0 + Math.sin(ang) * len;
    g.lineWidth = w; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
    if (d <= 0 || len < 8) return;
    const n = 2 + (r() < 0.35 ? 1 : 0);
    for (let i = 0; i < n; i++) branch(x1, y1, len * (0.62 + r() * 0.15), ang + (r() - 0.5) * 1.5, Math.max(1, w * 0.68), d - 1);
  };
  branch(x, y, h * 0.42, -Math.PI / 2 + (r() - 0.5) * 0.2, Math.max(4, h * 0.07), 4);
}
function drawGrave(g, x, y, s, col) {
  g.fillStyle = col; g.beginPath(); g.moveTo(x - 9 * s, y); g.lineTo(x - 9 * s, y - 20 * s);
  g.arc(x, y - 20 * s, 9 * s, Math.PI, 0); g.lineTo(x + 9 * s, y); g.closePath(); g.fill();
}
function drawCross(g, x, y, s, col) {
  g.fillStyle = col; g.fillRect(x - 2.5 * s, y - 46 * s, 5 * s, 46 * s); g.fillRect(x - 12 * s, y - 36 * s, 24 * s, 5 * s);
}
function buildBackground() {
  const th = G.theme; if (!th) return;
  bgScale = Math.min(2.2, viewScale || 1);
  const gy = LH - GROUND_H, R = rng32(G.seed | 0);

  // far layer: hills + castle
  let m = newLayer(TILE_W, LH);
  const hillY = x => { const a = x / TILE_W * TAU; return gy - 52 - (62 + Math.sin(a * 2 + 1) * 26 + Math.sin(a * 5 + 2) * 12 + Math.sin(a * 9) * 5); };
  m.g.fillStyle = th.far; m.g.beginPath(); m.g.moveTo(0, LH);
  for (let x = 0; x <= TILE_W; x += 8) m.g.lineTo(x, hillY(x));
  m.g.lineTo(TILE_W, LH); m.g.closePath(); m.g.fill();
  const cx = TILE_W * (0.2 + R() * 0.5);
  drawCastle(m.g, cx, hillY(cx) + 6, 1.1, th);
  bgFar = m.c;

  // mid layer: dead trees, graves, crosses, iron fence
  m = newLayer(TILE_M, LH);
  const n = 8;
  for (let i = 0; i < n; i++) {
    const bx = (i + 0.5) * TILE_M / n + (R() - 0.5) * 24, seed = (R() * 1e9) | 0, kind = R();
    for (const off of [-TILE_M, 0, TILE_M]) {
      if (kind < 0.45) drawDeadTree(m.g, bx + off, gy + 4, 70 + (seed % 60), rng32(seed), th.mid);
      else if (kind < 0.8) drawGrave(m.g, bx + off, gy + 2, 0.9 + (seed % 5) * 0.12, th.mid);
      else drawCross(m.g, bx + off, gy + 2, 1 + (seed % 3) * 0.2, th.mid);
    }
  }
  m.g.strokeStyle = th.mid; m.g.fillStyle = th.mid; m.g.lineWidth = 2;
  const posts = 37, pst = TILE_M / posts;
  for (let i = 0; i < posts; i++) {
    const x = i * pst + pst / 2;
    m.g.beginPath(); m.g.moveTo(x, gy + 2); m.g.lineTo(x, gy - 24); m.g.stroke();
    m.g.beginPath(); m.g.moveTo(x - 2.5, gy - 24); m.g.lineTo(x, gy - 31); m.g.lineTo(x + 2.5, gy - 24); m.g.closePath(); m.g.fill();
  }
  m.g.fillRect(0, gy - 19, TILE_M, 2); m.g.fillRect(0, gy - 8, TILE_M, 2);
  bgMid = m.c;

  // ground tile
  m = newLayer(GROUND_TILE, GROUND_H);
  const gg = m.g;
  const gr = gg.createLinearGradient(0, 0, 0, GROUND_H);
  gr.addColorStop(0, th.ground[0]); gr.addColorStop(0.14, th.ground[1]); gr.addColorStop(1, th.ground[2]);
  gg.fillStyle = gr; gg.fillRect(0, 0, GROUND_TILE, GROUND_H);
  gg.fillStyle = th.rim; gg.fillRect(0, 0, GROUND_TILE, 6);
  const tufts = [];
  for (let i = 0; i < 9; i++) tufts.push({ x: i * GROUND_TILE / 9 + R() * 8, h: 6 + R() * 10, lean: (R() - 0.5) * 6 });
  gg.fillStyle = th.rim;
  tufts.forEach(tf => [-GROUND_TILE, 0, GROUND_TILE].forEach(off => {
    gg.beginPath(); gg.moveTo(tf.x + off - 3, 6); gg.lineTo(tf.x + off + tf.lean, 6 - tf.h); gg.lineTo(tf.x + off + 3, 6); gg.fill();
  }));
  gg.strokeStyle = 'rgba(0,0,0,.35)'; gg.lineWidth = 1.5;
  for (let i = 0; i < 4; i++) {
    let x = 14 + R() * (GROUND_TILE - 28), y = 14 + R() * 10;
    gg.beginPath(); gg.moveTo(x, y);
    for (let k = 0; k < 3; k++) { x += (R() - 0.5) * 14; y += 8 + R() * 8; gg.lineTo(x, y); }
    gg.stroke();
  }
  gg.fillStyle = 'rgba(120,10,16,.55)';                       // blood pools
  gg.beginPath(); gg.ellipse(40 + R() * 20, 18, 14, 3, 0, 0, TAU); gg.fill();
  gg.beginPath(); gg.ellipse(112 + R() * 20, 30, 10, 2.5, 0, 0, TAU); gg.fill();
  const sx = 70 + R() * 40, sy = 40;                           // buried skull
  gg.fillStyle = '#c9c2b2'; gg.beginPath(); gg.arc(sx, sy, 6, 0, TAU); gg.fill(); gg.fillRect(sx - 4, sy + 3, 8, 5);
  gg.fillStyle = '#0a0405'; gg.beginPath(); gg.arc(sx - 2.3, sy, 1.6, 0, TAU); gg.fill(); gg.beginPath(); gg.arc(sx + 2.3, sy, 1.6, 0, TAU); gg.fill();
  gg.strokeStyle = '#bdb6a6'; gg.lineWidth = 2.5; gg.lineCap = 'round';   // bone
  gg.beginPath(); gg.moveTo(18, 58); gg.lineTo(44, 54); gg.stroke();
  bgGround = m.c;
}

function spawnObstacle() {

function drawEye(cx, cy, r, bx, by, blink) {
  ctx.save(); ctx.translate(cx, cy);
  const gl = ctx.createRadialGradient(0, 0, r * 0.3, 0, 0, r * 2.4);
  gl.addColorStop(0, 'rgba(255,40,30,.45)'); gl.addColorStop(1, 'rgba(255,40,30,0)');
  ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(0, 0, r * 2.4, 0, TAU); ctx.fill();
  const ry = r * 0.85 * (1 - blink);
  if (ry < 1.2) {
    ctx.strokeStyle = '#7f1d1d'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(-r * 1.2, 0);
    ctx.quadraticCurveTo(0, r * 0.35, r * 1.2, 0); ctx.stroke(); ctx.restore(); return;
  }
  ctx.fillStyle = '#f1d9c9'; ctx.beginPath(); ctx.ellipse(0, 0, r * 1.25, ry, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#5a0d12'; ctx.lineWidth = 2; ctx.stroke();
  ctx.strokeStyle = 'rgba(190,30,30,.6)'; ctx.lineWidth = 1; ctx.beginPath();
  ctx.moveTo(-r * 1.2, 0); ctx.lineTo(-r * 0.6, -ry * 0.3); ctx.moveTo(r * 1.2, 0); ctx.lineTo(r * 0.6, ry * 0.35); ctx.stroke();
  let dx = bx - cx, dy = by - cy; const d = Math.hypot(dx, dy) || 1, mm = Math.min(r * 0.45, d * 0.1);
  dx = dx / d * mm; dy = dy / d * mm * 0.6;                        // pupil follows the bird
  ctx.fillStyle = '#b91212'; ctx.beginPath(); ctx.ellipse(dx, dy, r * 0.62, Math.min(ry, r * 0.62), 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#050203'; ctx.beginPath(); ctx.ellipse(dx, dy, r * 0.12, Math.min(ry * 0.9, r * 0.55), 0, 0, TAU); ctx.fill();
  ctx.restore();
}
function blinkOf(o, k) { return clamp(Math.sin(G.tick * 0.045 + o.seed * 6 + k) * 8 - 7.2, 0, 1); }

/* Each piece is drawn in local space: x in [0, OBS_W]; y = 0 at the base, y = L at the tip facing the gap. */
function pieceBone(o, L, flipped, bx, by) {
  const cx = OBS_W / 2;
  ctx.fillStyle = '#17110f'; ctx.fillRect(10, -80, OBS_W - 20, L + 80);
  for (let y = L - 62; y > -30; y -= 19) {
    const w = 24 + Math.sin(y * 0.3) * 2;
    ctx.fillStyle = '#d9d3c4'; rr(ctx, cx - w / 2, y, w, 14, 5); ctx.fill();
    ctx.strokeStyle = '#5f574b'; ctx.lineWidth = 1.5; ctx.stroke();
  }
  ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.strokeStyle = '#cfc8b8';
  for (let y = L - 80; y > -10; y -= 36) {
    ctx.beginPath(); ctx.moveTo(cx - 8, y); ctx.quadraticCurveTo(cx - 34, y - 6, cx - 27, y + 22); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + 8, y); ctx.quadraticCurveTo(cx + 34, y - 6, cx + 27, y + 22); ctx.stroke();
  }
  // skull at the tip
  ctx.fillStyle = '#e8e2d4'; ctx.beginPath(); ctx.ellipse(cx, L - 34, 26, 21, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ddd6c6'; rr(ctx, cx - 17, L - 24, 34, 24, 6); ctx.fill();
  ctx.strokeStyle = '#3a342b'; ctx.lineWidth = 1.5;
  for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(cx + k * 6, L - 13); ctx.lineTo(cx + k * 6, L - 1); ctx.stroke(); }
  ctx.fillStyle = '#0a0405';
  ctx.beginPath(); ctx.ellipse(cx - 10, L - 36, 6.5, 7.5, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + 10, L - 36, 6.5, 7.5, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx, L - 29); ctx.lineTo(cx - 3.5, L - 22); ctx.lineTo(cx + 3.5, L - 22); ctx.closePath(); ctx.fill();
  const gx = clamp((bx - cx) * 0.02, -1.6, 1.6), gyy = clamp((by - (L - 36)) * 0.02, -1.6, 1.6);
  ctx.fillStyle = '#ff3030';
  ctx.beginPath(); ctx.arc(cx - 10 + gx, L - 36 + gyy, 2.3, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 10 + gx, L - 36 + gyy, 2.3, 0, TAU); ctx.fill();
}
function pieceEyes(o, L, flipped, bx, by) {
  const w = OBS_W, cx = w / 2;

  g.addColorStop(0, '#120d10'); g.addColorStop(0.5, '#261b21'); g.addColorStop(1, '#120d10');

  }

/* =====================================================================
   13. HUD / TEXT HELPERS
   ===================================================================== */
function progress() {
  const l = G.lvl; if (!l) return 0;
  return l.obj === 'clear' ? G.passed / l.target : l.obj === 'survive' ? G.time / l.target : G.score / l.target;
}
function updateHUD() {
  const l = G.lvl; if (!l) return;
  el.score.textContent = G.score;
  let txt;
  if (l.obj === 'clear') txt = t('hudClear', Math.min(G.passed, l.target), l.target);
  else if (l.obj === 'survive') txt = t('hudSurvive', Math.max(0, Math.ceil(l.target - G.time)));
  else txt = t('hudScore', Math.min(G.score, l.target), l.target);
  el.obj.textContent = txt;
  el.fill.style.width = (clamp(progress(), 0, 1) * 100) + '%';
  el.lvl.textContent = t('level', G.levelIdx + 1);
  el.phase.textContent = t('nightmare');
}
function updateReadyText() {
  if (!G.lvl) return;
  el.rLevel.textContent = t('level', G.levelIdx + 1);
  el.rName.textContent = lname(G.lvl);
  el.rObj.textContent = objText(G.lvl);
  el.rTap.textContent = t('tapStart');
}
function warn(key, soft, rawText) {
  el.warnTxt.textContent = rawText || t(key);
  el.warn.className = soft ? 'soft' : '';

}
let toastTimer = 0;
function toast(msg) {
  el.toast.textContent = msg; el.toast.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.toast.classList.remove('show'), 2000);
}

function beginPlay() { G.state = 'playing'; el.ready.classList.remove('on'); applyDroneForLevel(); }

function checkWin() {

  return false;
}
function collectSoul(x, y) {

}

  }

  const prevBest = save.best[idx] || 0, newBest = G.score > prevBest && G.score > 0;
  if (newBest) { save.best[idx] = G.score; writeSave(); }
  G.result = {
    win: false, idx, score: G.score, best: Math.max(prevBest, G.score), newBest,
    souls: G.soulsGot, soulsTotal: G.soulsGot + G.soulsMissed, progress: clamp(progress(), 0, 1),

function winLevel() {
  if (G.state !== 'playing') return;

  save.stars[idx] = Math.max(prevStars, stars);
  save.best[idx] = Math.max(prevBest, G.score);
  const hasNext = idx + 1 < LEVELS.length;
  if (hasNext) save.unlocked = Math.max(save.unlocked, idx + 2);

function showResult() { renderResult(true); setModal('result'); }

/* =====================================================================
   15. UPDATE (fixed 60 Hz step)
   ===================================================================== */
function updatePlaying() {
  G.time += 1 / 60;
  const gy = LH - GROUND_H;
  bird.vy = Math.min(bird.vy + GRAVITY, MAX_FALL); bird.y += bird.vy;
  bird.rot += (clamp(bird.vy * 0.075, -0.45, 1.3) - bird.rot) * 0.2;
  if (bird.y < BIRD_R) { bird.y = BIRD_R; bird.vy = 0; }
  if (bird.y + BIRD_R >= gy) { bird.y = gy - BIRD_R; die(); return; }

  G.spawnDist -= G.speed;
  if (G.spawnDist <= 0) { spawnObstacle(); G.spawnDist += G.space; }

  for (let i = G.obstacles.length - 1; i >= 0; i--) {
    const o = G.obstacles[i];
    o.x -= G.speed;
    o.gapY = o.baseC + Math.sin(G.tick * 0.04 + o.ph) * o.sway;
    const top = o.gapY - o.gap / 2, bot = o.gapY + o.gap / 2, hx = o.x + 4, hw = OBS_W - 8;
    if (circleRect(bird.x, bird.y, BIRD_R, hx, -100, hw, top + 100) || circleRect(bird.x, bird.y, BIRD_R, hx, bot, hw, gy - bot + 100)) { die(); return; }
    const sl = o.soul;
    if (sl && !sl.taken) {
      const sx = o.x + OBS_W / 2, sy = o.gapY + sl.off;
      if (Math.hypot(sx - bird.x, sy - bird.y) < BIRD_R + 13) { sl.taken = true; collectSoul(sx, sy); if (checkWin()) return; }
    }
    if (!o.passed && o.x + OBS_W < bird.x - BIRD_R) { o.passed = true; passObstacle(o); if (G.state !== 'playing') return; }
    if (o.x < -OBS_W - 20) G.obstacles.splice(i, 1);
  }

  checkPhases();
  if (G.horror > 0.5 && G.tick % 4 === 0) {          // ember trail for the corrupted bird
    addP({ type: 'ember', x: bird.x - 12, y: bird.y + rand(-4, 4), vx: rand(-1.2, -0.3), vy: rand(-0.4, 0.4), g: -0.01, drag: 0.98, size: rand(1.5, 3), life: rand(20, 34), max: 34, world: true });
  }
  if (G.phase >= 2 && G.tick % 52 === 0) Snd.heartbeat();
  G.whisperT--;
  if (G.whisperT <= 0 && G.phase >= 1 && G.horror >= 0.3) {
    warn('', true, pick(t('whispers'))); Snd.whisper(); G.whisperT = 900 + Math.floor(rand(0, 600));
  }
  if (G.tick % 6 === 0) updateHUD();
  checkWin();
}
function updateDead() {
  G.deadTimer++;
  const gy = LH - GROUND_H;
  bird.vy = Math.min(bird.vy + GRAVITY, MAX_FALL); bird.y += bird.vy;
  if (bird.y + BIRD_R >= gy) { bird.y = gy - BIRD_R; bird.vy = 0; }
  bird.rot = Math.min(1.6, bird.rot + 0.1);
  if (G.deadTimer === 58) showResult();
}
function updateWin() {
  G.winTimer++;
  G.winSpeed *= 0.96;
  for (const o of G.obstacles) { o.x -= G.winSpeed; o.gapY = o.baseC + Math.sin(G.tick * 0.04 + o.ph) * o.sway; }
  bird.vy *= 0.92; bird.y += bird.vy; bird.rot *= 0.9;
  bird.y = clamp(bird.y, BIRD_R, LH - GROUND_H - BIRD_R - 4);
  if (G.winTimer % 6 === 0) wispBurst(bird.x + rand(-14, 14), bird.y + rand(-12, 12), 2);
  if (G.winTimer === 85) showResult();
}
function updateHover() {
  const base = G.state === 'menu' ? LH * 0.46 : LH * 0.42;
  bird.y = base + Math.sin(G.tick * 0.09) * 7; bird.vy = 0;
  bird.rot = Math.sin(G.tick * 0.09) * 0.08;
  if (G.tick % 38 === 0) bird.wing = 1;
}
function updateFX() {
  // screen shake / flashes
  if (G.shake > 0) { G.shake *= 0.88; if (G.shake < 0.1) G.shake = 0; G.sx = rand(-1, 1) * G.shake * (REDUCED ? 0.35 : 1); G.sy = rand(-1, 1) * G.shake * (REDUCED ? 0.35 : 1); }
  G.flash *= 0.9; G.redFlash *= 0.93;
  if (G.bolt) { G.bolt.life--; if (G.bolt.life <= 0) G.bolt = null; }
  bird.wing = Math.max(0, bird.wing - 0.08);

  // random lightning
  const chance = (0.0006 + 0.0022 * G.horror) * (G.phase >= 2 ? 2.2 : 1);
  if (!G.bolt && G.state !== 'dead' && Math.random() < chance) {
    const x0 = rand(40, LW - 40), pts = [[x0, 0]], maxY = LH * rand(0.35, 0.6);
    let x = x0, y = 0;
    while (y < maxY) { y += rand(18, 38); x += rand(-26, 26); pts.push([x, y]); }
    G.bolt = { pts, life: 10 }; G.flash = (REDUCED ? 0.35 : 0.9);
    setTimeout(() => { if (G.state !== 'paused' && G.state !== 'map') Snd.thunder(); }, rand(250, 1100));
  }

  // ghosts, clouds
  for (const g of G.ghosts) {
    g.x -= g.vx + G.ws * g.depth * 0.35;
    if (g.x < -80) { g.x = LW + 80 + rand(0, 120); g.y = rand(60, Math.max(120, LH - GROUND_H - 90)); }
  }
  for (const c of G.clouds) { c.x -= c.v + G.ws * 0.05; if (c.x < -c.w) c.x = LW + c.w; }

  // blood rain in the nightmare phase / blood biome
  if (G.theme === BIOMES[3] || G.phase >= 2) {
    if (Math.random() < 0.35) addP({ type: 'rain', x: rand(0, LW + 40), y: -10, vx: -0.8, vy: rand(5, 8), g: 0, drag: 1, size: 1, life: 90, max: 90 });
  }

  // particles
  const gy = LH - GROUND_H;
  for (let i = G.particles.length - 1; i >= 0; i--) {
    const p = G.particles[i];
    p.life--;
    if (p.life <= 0) { G.particles.splice(i, 1); continue; }
    if (p.type === 'rain') { p.x += p.vx; p.y += p.vy; if (p.y > gy) G.particles.splice(i, 1); continue; }
    p.vy += p.g || 0; p.vx *= p.drag || 1; p.vy *= (p.drag || 1);
    p.x += p.vx - (p.world ? G.ws : 0); p.y += p.vy;
    if (p.rot !== undefined) p.rot += p.vr || 0;
    if (p.type === 'blood' && !p.splat && p.y >= gy) { p.y = gy; p.vy = 0; p.vx *= 0.3; p.splat = true; p.life = Math.min(p.life, 40); }
    if (p.splat) p.x -= G.ws;
  }
  for (let i = G.texts.length - 1; i >= 0; i--) { const tx = G.texts[i]; tx.life--; tx.y -= 0.8; if (tx.life <= 0) G.texts.splice(i, 1); }
}
function update() {
  G.tick++;
  const st = G.state;
  if (st === 'map') return;
  let ws = 0.5;
  if (st === 'playing') ws = G.speed;
  else if (st === 'ready') ws = 0.8;
  else if (st === 'dead') ws = 0;
  else if (st === 'win') ws = G.winSpeed;
  G.ws = ws; G.scroll += ws;
  if (st === 'playing') updatePlaying();
  else if (st === 'dead') updateDead();
  else if (st === 'win') updateWin();
  else updateHover();
  updateFX();
}

function renderMap(keepScroll) {

    else if (kind < 0.72) deco += `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${sc2.toFixed(2)})" stroke="#1d1420" stroke-width="3" stroke-linecap="round" fill="none"><path d="M0 16V-14M0 -4L-10 -12M0 -8L9 -17M-5 -8L-9 -3M4 -2L10 -6"/></g>`;

  }

    <polygon points="-82,-75 -67,-105 -52,-75"/><polygon points="52,-60 67,-90 82,-60"/><polygon points="-16,-100 0,-140 16,-100"/>

/* =====================================================================
   18. INPUT
   ===================================================================== */
function handleAction(a, b) {
  switch (a) {
    case 'play': case 'map': case 'quitMap': goMap(); break;
    case 'menu': case 'quitMenu': goMenu(); break;
    case 'lang': setLang(b.dataset.v); break;
    case 'sound': toggleSound(); break;
    case 'node': onNode(parseInt(b.dataset.i, 10), b); break;
    case 'infoPlay': { const i = G.infoIdx; closeInfo(); startLevel(i); break; }
    case 'infoClose': closeInfo(); break;
    case 'pause': pauseGame(); break;
    case 'resume': resumeGame(); break;
    case 'retry': startLevel(G.levelIdx); break;
    case 'next': startLevel(Math.min(G.levelIdx + 1, LEVELS.length - 1)); break;
    default: break;
  }
}
game.addEventListener('click', e => {
  const b = e.target.closest('[data-action]'); if (!b) return;
  Snd.init();
  const a = b.dataset.action;
  if (a !== 'node' && a !== 'sound') Snd.click();
  handleAction(a, b);
  if (b.blur) b.blur();
});
game.addEventListener('pointerdown', e => {
  Snd.init();
  if (e.target.closest('button')) return;
  if (G.state === 'ready' || G.state === 'playing') { e.preventDefault(); onAction(); }
});
game.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    if (G.state === 'ready' || G.state === 'playing') { e.preventDefault(); if (!e.repeat) onAction(); }
    return;
  }
  if (e.repeat) return;
  if (e.code === 'KeyP' || e.code === 'Escape') {
    if (G.state === 'playing') pauseGame(); else if (G.state === 'paused') resumeGame(); else if (G.modal === 'info') closeInfo();
    return;
  }
  if (e.code === 'KeyR' && (G.modal === 'result' || G.state === 'paused')) startLevel(G.levelIdx);
});
document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'playing') pauseGame(); });

/* =====================================================================
   19. MAIN LOOP & BOOT
   ===================================================================== */
let lastT = 0, acc = 0;
function frame(now) {
  const dt = Math.min(100, now - lastT); lastT = now;
  if (G.state === 'paused') acc = 0;
  else { acc += dt; let guard = 0; while (acc >= STEP && guard++ < 6) { update(); acc -= STEP; } }
  draw();
  requestAnimationFrame(frame);
}
function boot() {
  loadSave();
  const nav = (navigator.language || '').toLowerCase();
  lang = save.lang || (nav.startsWith('en') ? 'en' : 'ar');
  $$('[data-icon]').forEach(n => { n.innerHTML = ICON[n.dataset.icon] || ''; });
  Snd.setMuted(!save.sound);
  layout();
  goMenu();
  applyLang();
  lastT = performance.now();
  requestAnimationFrame(frame);
}
boot();
})();
</script>
